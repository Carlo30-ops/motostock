# ==========================================
# 🛡️ NGINX CONFIGURACIÓN CON WAF (WEB APPLICATION FIREWALL)
# ==========================================
# Configuración de Nginx con ModSecurity para MotoStock

# ==========================================
# 📋 CONFIGURACIÓN BÁSICA
# ==========================================
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ==========================================
    # 📊 INCLUDES
    # ==========================================
    include /etc/nginx/mime.types;
    include /etc/nginx/waf_rules.conf;
    
    # ==========================================
    # 📋 CONFIGURACIÓN DE LOGGING
    # ==========================================
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    log_format waf '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time $request_id '
                   'tx=0"$connection_requests=$connection_id '
                   'request_length=$request_length '
                   'request_body=$request_body';
    
    access_log /var/log/nginx/access.log main_ext;
    access_log /var/log/nginx/waf.log waf;
    
    # ==========================================
    # 🚀 PERFORMANCE OPTIMIZATIONS
    # ==========================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    
    # ==========================================
    # 📦 BUFFER SETTINGS
    # ==========================================
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    
    # ==========================================
    # 🗄️ GZIP COMPRESSION
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # ==========================================
    # 🔒 SECURITY HEADERS
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' ws: wss:; form-action 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    
    # ==========================================
    # 🌐 UPSTREAM SERVERS
    # ==========================================
    upstream motostock_backend {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=30s;
        server backend2:8000 max_fails=3 fail_timeout=30s backup;
        keepalive 32;
    }
    
    upstream motostock_frontend {
        server frontend:5173 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    # ==========================================
    # 🚨 RATE LIMITING
    # ==========================================
    # Rate limiting por IP
    limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s burst=20 nodelay;
    
    # Rate limiting para API
    limit_req_zone $server_name zone=perserver:10m rate=60r/s burst=100 nodelay;
    
    # Rate limiting para autenticación
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s burst=10 nodelay;
    
    # ==========================================
    # 📊 SERVER BLOCK
    # ==========================================
    server {
        listen 80;
        listen [::]:80;
        server_name motostock.local www.motostock.local;
        
        # ==========================================
        # 🔍 REDIRECCIÓN A HTTPS
        # ==========================================
        return 301 https://$server_name$request_uri;
    }
    
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name motostock.local www.motostock.local;
        
        # ==========================================
        # 🔒 SSL CONFIGURATION
        # ==========================================
        ssl_certificate /etc/nginx/ssl/motostock.crt;
        ssl_certificate_key /etc/nginx/ssl/motostock.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        
        # SSL hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES128-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_stapling on;
        ssl_stapling_verify on;
        
        # ==========================================
        # 📋 ROOT DIRECTORY
        # ==========================================
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # ==========================================
        # 🛡️ WAF INTEGRATION
        # ==========================================
        ModSecurityEnabled on;
        ModSecurityConfig /etc/nginx/modsecurity.conf;
        
        # WAF rules location
        location = /waf-status {
            allow 127.0.0.1;
            deny all;
            default_type text/plain;
            return 200 'WAF Status: OK';
        }
        
        # ==========================================
        # 📊 HEALTH CHECK
        # ==========================================
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 'healthy';
        }
        
        location = /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
        
        # ==========================================
        # 📁 STATIC FILES
        # ==========================================
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            try_files $uri = /static$uri = /static$uri/ /index.html;
            access_log off;
            add_header X-Cache-Status "HIT";
        }
        
        # ==========================================
        # 🔍 API PROXY
        # ==========================================
        location /api/ {
            # Rate limiting específico para API
            limit_req zone=perip burst=20 nodelay;
            limit_req zone=perserver burst=100 nodelay;
            
            # Headers para proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WAF para API
            ModSecurityEnabled on;
            ModSecurityRequestBodyAccess On;
            ModSecurityResponseBodyAccess On;
            
            # Proxy configuration
            proxy_pass http://motostock_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Error handling
            proxy_intercept_errors on;
            proxy_intercept_errors on;
            error_page 502 503 504 /api-error.html;
        }
        
        # ==========================================
        # 🔐 AUTHENTICATION ENDPOINTS
        # ==========================================
        location ~ ^/api/auth/ {
            # Rate limiting restrictivo para autenticación
            limit_req zone=auth burst=5 nodelay;
            
            # WAF estricto para auth
            ModSecurityEnabled on;
            ModSecurityRequestBodyAccess On;
            ModSecurityResponseBodyAccess On;
            
            # Reglas adicionales para auth
            ModSecurityRule "REQUEST_BODY@rx (?i)(?:password|secret|key|token)" \
                "id:200001,\
                phase:2,\
                block,\
                log,\
                msg:'Sensitive parameter in auth'";
            
            # Headers de seguridad adicionales para auth
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; form-action 'self';" always;
            
            # Proxy to backend
            proxy_pass http://motostock_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ==========================================
        # 📈 FILE UPLOAD PROTECTION
        # ==========================================
        location ~ ^/api/(?:upload|files|import|export) {
            # Rate limiting para uploads
            limit_req zone=perip burst=5 nodelay;
            
            # WAF para uploads
            ModSecurityEnabled on;
            ModSecurityRequestBodyAccess On;
            ModSecurityResponseBodyAccess On;
            
            # Validaciones de archivo
            if ($request_filename ~* \.(php|phtml|php3|php4|php5|pl|py|rb|sh|bat|exe|scr|cmd)$) {
                return 403 "File type not allowed";
            }
            
            # Límite de tamaño
            client_max_body_size 50M;
            
            proxy_pass http://motostock_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ==========================================
        # 🛡️ ADMIN ENDPOINTS
        # ==========================================
        location ~ ^/api/(?:admin|users|settings|config) {
            # Rate limiting muy restrictivo
            limit_req zone=perip burst=10 nodelay;
            
            # WAF estricto para admin
            ModSecurityEnabled on;
            ModSecurityRequestBodyAccess On;
            ModSecurityResponseBodyAccess On;
            
            # Headers de seguridad adicionales
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self';" always;
            
            proxy_pass http://motostock_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ==========================================
        # 📊 MONITORING ENDPOINTS
        # ==========================================
        location ~ ^/(?:metrics|status|health|ping) {
            # Permitir solo desde localhost
            allow 127.0.0.1;
            allow ::1;
            deny all;
            
            # Rate limiting generoso
            limit_req zone=perip burst=30 nodelay;
            
            # WAF desactivado para monitoring
            ModSecurityEnabled off;
            
            # Proxy to backend
            proxy_pass http://motostock_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ==========================================
        # 🚨 ERROR PAGES
        # ==========================================
        error_page 400 /error.html;
        error_page 401 /error.html;
        error_page 403 /error.html;
        error_page 404 /error.html;
        error_page 429 /error.html;
        error_page 500 502 503 504 /error.html;
        
        location = /error.html {
            internal;
            root /usr/share/nginx/html;
        }
        
        # ==========================================
        # 📄 DEFAULT LOCATION
        # ==========================================
        location / {
            # Rate limiting general
            limit_req zone=perip burst=30 nodelay;
            limit_req zone=perserver burst=100 nodelay;
            
            # WAF habilitado
            ModSecurityEnabled on;
            ModSecurityRequestBodyAccess On;
            ModSecurityResponseBodyAccess On;
            
            # Try files
            try_files $uri $uri/ /index.html;
            
            # Cache para SPA
            location ~* \.(html)$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
            }
            
            # Security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
    
    # ==========================================
    # 📊 MONITORING SERVER
    # ==========================================
    server {
        listen 8080;
        server_name localhost;
        
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
        
        location /waf_status {
            allow 127.0.0.1;
            deny all;
            default_type text/plain;
            return 200 'WAF Status: Active';
        }
    }
}

# ==========================================
# 📊 STREAMING SERVER (si aplica)
# ==========================================
server {
    listen 1935;
    server_name motostock.local;
    
    location / {
        proxy_pass http://motostock_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $binary_remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
