version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: motostock_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-motostock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motostock_pass}
      POSTGRES_DB: ${POSTGRES_DB:-motostock}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motostock}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - motostock-network

  redis:
    image: redis:7-alpine
    container_name: motostock_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_pass}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - motostock-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: motostock_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-motostock}:${POSTGRES_PASSWORD:-motostock_pass}@db:5432/${POSTGRES_DB:-motostock}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-motostock}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-supersecretkey_change_in_production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change_this_in_production}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - motostock-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: motostock_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_APP_NAME: ${VITE_APP_NAME:-MotoStock}
      VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - motostock-network

  # Monitoring con Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: motostock_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - motostock-network

  # Monitoring con Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: motostock_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - motostock-network

  # Backup automático
  backup:
    image: postgres:15-alpine
    container_name: motostock_backup
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-motostock_pass}
    volumes:
      - ./backups:/backups
      - pgdata:/var/lib/postgresql/data
    command: |
      sh -c "
      while true; do
        echo 'Creating backup at $(date)'
        pg_dump -h db -U ${POSTGRES_USER:-motostock} -d ${POSTGRES_DB:-motostock} > /backups/motostock_backup_$(date +%Y%m%d_%H%M%S).sql
        echo 'Backup created'
        echo 'Cleaning old backups (keeping last 7)'
        find /backups -name 'motostock_backup_*.sql' -type f -mtime +7 -delete
        echo 'Old backups cleaned'
        sleep 86400
      done
      "
    networks:
      - motostock-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  motostock-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
